name: CI

# Minimal push gate. The full PR workflow lives in pr-validation.yml
# (ci.yml.disabled was a duplicate that failed independently).
on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: |
          python -m pytest tests/ \
            --cov=pyspark_tools \
            --cov-report=term-missing \
            --cov-fail-under=60
