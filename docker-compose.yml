version: '3.8'

services:
  # Stdio MCP process — no HTTP port. Compose is for tests, not a web app.
  pyspark-tools:
    build: .
    container_name: pyspark-tools-server
    stdin_open: true
    tty: true
    volumes:
      - pyspark_data:/data
      - pyspark_output:/output
    environment:
      - PYSPARK_TOOLS_DB_PATH=/data/memory.sqlite
      - PYSPARK_TOOLS_OUTPUT_DIR=/output
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  # Test service
  pyspark-tools-test:
    build: .
    container_name: pyspark-tools-test
    volumes:
      - ./tests:/app/tests
      - ./pyspark_tools:/app/pyspark_tools
      - ./coverage_reports:/app/coverage_reports
      - pyspark_test_data:/data
    environment:
      - PYTHONPATH=/app
      - PYSPARK_TOOLS_DB_PATH=/data/test.sqlite
    command: python -m pytest tests/ -q
    profiles:
      - test

  test-fast:
    build: .
    container_name: test-fast
    volumes:
      - ./tests:/app/tests
      - ./pyspark_tools:/app/pyspark_tools
    environment:
      - PYTHONPATH=/app
    command: python -m pytest tests/ -q -m fast
    profiles:
      - test

  test-coverage:
    build: .
    container_name: test-coverage
    volumes:
      - ./tests:/app/tests
      - ./pyspark_tools:/app/pyspark_tools
      - ./coverage_reports:/app/coverage_reports
    environment:
      - PYTHONPATH=/app
    command: python -m pytest tests/ --cov=pyspark_tools --cov-fail-under=60
    profiles:
      - test
      - coverage

volumes:
  pyspark_data:
    driver: local
  pyspark_output:
    driver: local
  pyspark_test_data:
    driver: local
